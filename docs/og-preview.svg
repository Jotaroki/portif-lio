<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Sky to Aqua Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <!-- Sun Ray Radial Glow -->
    <radialGradient id="sunGlow" cx="20%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#e0f2fe" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#f0f9ff" stop-opacity="0.45" />
    </linearGradient>

    <!-- Bubble Gradient -->
    <radialGradient id="bubbleGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.25" />
      <stop offset="90%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.7" />
    </radialGradient>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#sunGlow)" />

  <!-- Floating Aero Bubbles -->
  <circle cx="100" cy="180" r="45" fill="url(#bubbleGrad)" stroke="rgba(255,255,255,0.7)" stroke-width="2" />
  <circle cx="1080" cy="140" r="75" fill="url(#bubbleGrad)" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" />
  <circle cx="960" cy="480" r="50" fill="url(#bubbleGrad)" stroke="rgba(255,255,255,0.7)" stroke-width="2" />
  <circle cx="180" cy="520" r="35" fill="url(#bubbleGrad)" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" />

  <!-- Central Aero Glass Panel -->
  <rect x="150" y="100" width="900" height="430" rx="28" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.85)" stroke-width="2" />
  
  <!-- Glass Top Reflection Stripe -->
  <path d="M 150 128 Q 600 160 1050 128 L 1050 100 L 150 100 Z" fill="rgba(255,255,255,0.4)" />

  <!-- Content -->
  <!-- Monogram Pill Badge -->
  <rect x="210" y="150" width="130" height="38" rx="19" fill="#0284c7" fill-opacity="0.15" stroke="rgba(2,132,199,0.3)" stroke-width="1.5" />
  <text x="275" y="175" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0369a1" letter-spacing="2">NAS // DEV</text>

  <!-- Title -->
  <text x="210" y="240" font-family="'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
    Nicolas de Araujo Silveira
  </text>

  <!-- Subtitle / Role -->
  <text x="210" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#0284c7">
    IT Support Analyst &amp; Backend / CLI Developer
  </text>

  <!-- Bio statement -->
  <text x="210" y="350" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" fill="#334155" width="700">
    Conectando infraestrutura, desenvolvimento e automação para transformar
  </text>
  <text x="210" y="380" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" fill="#334155" width="700">
    problemas complexos em soluções práticas.
  </text>

  <!-- Tech tags bar -->
  <g transform="translate(210, 430)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="110" height="34" rx="17" fill="#ffffff" fill-opacity="0.8" stroke="rgba(2,132,199,0.2)" stroke-width="1" />
    <text x="55" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">Arch Linux</text>

    <!-- Pill 2 -->
    <rect x="125" y="0" width="105" height="34" rx="17" fill="#ffffff" fill-opacity="0.8" stroke="rgba(2,132,199,0.2)" stroke-width="1" />
    <text x="177" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">Node.js</text>

    <!-- Pill 3 -->
    <rect x="245" y="0" width="85" height="34" rx="17" fill="#ffffff" fill-opacity="0.8" stroke="rgba(2,132,199,0.2)" stroke-width="1" />
    <text x="287" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">Go</text>

    <!-- Pill 4 -->
    <rect x="345" y="0" width="115" height="34" rx="17" fill="#ffffff" fill-opacity="0.8" stroke="rgba(2,132,199,0.2)" stroke-width="1" />
    <text x="402" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">TypeScript</text>

    <!-- Pill 5 -->
    <rect x="475" y="0" width="115" height="34" rx="17" fill="#ffffff" fill-opacity="0.8" stroke="rgba(2,132,199,0.2)" stroke-width="1" />
    <text x="532" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">Hyprland</text>
  </g>
</svg>
