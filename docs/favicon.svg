<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Sphere Body Gradient -->
    <radialGradient id="orbGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>
    
    <!-- Top Gloss Reflection -->
    <linearGradient id="glossGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Bottom Aquatic/Organic Tint Glow -->
    <radialGradient id="greenGlint" cx="60%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="orbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0369a1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="32" cy="32" r="28" fill="#38bdf8" opacity="0.25" filter="blur(3px)" />

  <!-- Base Orb -->
  <circle cx="32" cy="32" r="26" fill="url(#orbGrad)" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" filter="url(#orbShadow)" />

  <!-- Bottom Green/Aqua Organic Reflection -->
  <circle cx="32" cy="32" r="26" fill="url(#greenGlint)" />

  <!-- Inner Rim Light -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" />

  <!-- Top Specular Crescent/Ellipse Reflection -->
  <ellipse cx="32" cy="19" rx="16" ry="10" fill="url(#glossGrad)" />

  <!-- Center Monogram "N" (Aero Glossy Style) -->
  <text x="32" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#ffffff" style="text-shadow: 0 1px 2px rgba(2, 6, 23, 0.4);">N</text>
</svg>
